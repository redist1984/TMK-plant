<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мнемосхемы — TMK</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111821; --panel2:#0e141b; --line:#1e2833;
    --ink:#e8eef5; --ink2:#a8b7c7; --ink3:#6f8093;
    --accent:#2fbf9a; --ok:#2fbf9a; --bad:#e05561;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header b{font-size:15px}
  header .sub{color:var(--ink3);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:12.5px}
  .wrap{display:flex;flex-direction:column;height:calc(100% - 48px)}
  .stage{position:relative;flex:1;overflow:auto;background:#05080b;padding-bottom:34px}
  .frame{position:relative;margin:0 auto}
  .frame img{display:block;width:100%;height:auto}
  .hidden .chip{display:none}

  /* чип ложится поверх поля значения в схеме и закрывает исходные нули */
  .chip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
    background:#060d13;border:1px solid #2f4356;border-radius:2px;padding:1px 2px;min-width:34px;
    font:600 11.5px/1 ui-monospace,Menlo,Consolas,monospace;color:#eaf4ff;white-space:nowrap;overflow:hidden}
  .chip.ok{color:#c8ffe9}
  .chip.bad{color:#ffb3b8;border-color:#7a2f36;background:#1a0b0e}
  /* подпись тега видна только по наведению: на экране он и так подписан */

  /* нижняя панель как в АСУТП: вкладки отделений */
  .deptbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1px;
    background:#dfe3e8;padding:1px;height:28px;align-items:stretch;overflow-x:auto}
  .deptbar button{flex:1 0 auto;border:0;background:#eceff3;color:#2b3947;
    font:400 11.5px/1 system-ui,sans-serif;padding:0 10px;cursor:pointer;white-space:nowrap;
    border-right:1px solid #c9cfd6}
  .deptbar button.here{background:#fff;color:#0b7a63;font-weight:700;box-shadow:inset 0 -2px 0 #0b7a63}
  .deptbar button[disabled]{color:#8d99a6;cursor:default}
  header .hint{color:var(--ink3);font-size:11.5px}
  /* режим разметки: ?grid=1 — сетка 5% для расстановки чипов */
  .frame.grid::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
    background:
      repeating-linear-gradient(to right, rgba(255,0,0,.55) 0 1px, transparent 1px 5%),
      repeating-linear-gradient(to bottom, rgba(255,0,0,.55) 0 1px, transparent 1px 5%),
      repeating-linear-gradient(to right, rgba(255,255,0,.9) 0 1px, transparent 1px 10%)}
</style>
</head>
<body>
<header>
  <b id="h1">Мнемосхемы</b>
  <span class="sub" id="sub">расчётные значения на экранах АСУТП</span>
  <span class="hint" id="note"></span>
  <span class="right"><label><input type="checkbox" id="show"> <span id="showLbl">показать значения</span></label></span>
</header>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <img id="img" alt="">
      <div id="chips"></div>
      <div class="deptbar" id="deptbar"></div>
    </div>
  </div>
</div>

<!-- модули двойника: порядок важен -->
<script src="twin/heatcap.js"></script>
<script src="twin/converter.js"></script>
<script src="twin/model.js"></script>
<script src="twin/dcs-signals.data.js"></script>
<script src="twin/tank.js"></script>
<script src="twin/vessels.js"></script>
<script src="twin/melt.js"></script>

<script src="lang.js"></script>
<script>
'use strict';
const TXT = {
  ru: { h1: 'Мнемосхемы', sub: 'расчётные значения на экранах АСУТП', show: 'показать значения',
        note: 'Значения считает модель двойника. Исходные цифры на скриншотах АСУТП нулевые — их закрывают наши чипы.' },
  uz: { h1: 'Mnemoyxemalar', sub: 'АSU TP ekranlarida hisobiy qiymatlar', show: 'qiymatlarni ko‘rsatish',
        note: 'Qiymatlarni egizak modeli hisoblaydi. АSU TP skrinshotlaridagi asl raqamlar nol — ularni bizning chiplar yopadi.' }
};
let lang = 'ru';
const L = () => TXT[lang] || TXT.ru;

let SCREENS = [];
let TABS = [];
let cur = 0;
let showValues = true;

// проектный расход серы — от него считаются скорости и проценты
const NOMINAL_S = 20.48;
const S_DENSITY = 1.792;   // т/м³ жидкой серы

/** Значение для чипа. */
function valueOf(key) {
  const M = self.TwinMelt, V = self.TwinVessels;
  const melt = M ? M.solve({ sulfur_t_h: NOMINAL_S, ashFeed: 120 }) : null;

  if (key.startsWith('level:')) {
    const tag = key.slice(6);
    const row = V ? V.list({}, lang).find((x) => x.tag === tag) : null;
    return row ? { v: row.level, bad: row.status !== 'normal' && row.status !== 'none' } : { v: null };
  }
  if (key.startsWith('const:')) return { v: parseFloat(key.slice(6)) };
  // Скорость двигателя — от расхода: доля загрузки агрегата от его проектной
  // производительности. Ключ "speed:8" значит «8 т/ч по паспорту».
  if (key === 'speed') return { v: 100 };
  if (key.startsWith('speed:')) {
    // "speed:8:4" — паспорт 8 т/ч на аппарат, аппаратов 4: расход делится между ними
    const parts = key.slice(6).split(':');
    const cap = parseFloat(parts[0]);
    const n = parts[1] ? parseInt(parts[1], 10) : 1;
    if (!(cap > 0) || !(n > 0)) return { v: null };
    return { v: Math.min(120, ((NOMINAL_S / n) / cap) * 100) };
  }
  if (key === 'valve') return { v: 100 };
  if (key === 'flow.m3') return { v: melt ? melt.sulfur_t_h / S_DENSITY : null };
  if (key === 'melt.sulfur') return { v: melt ? melt.sulfur_t_h : null };
  if (key === 'melt.tMelt') return { v: melt ? melt.tMelt : null };
  if (key === 'melt.steam08') return { v: melt ? melt.steam08_t_h : null };
  return { v: null };
}

const fmt = (v) => v == null ? '—' : (Math.round(v * 10) / 10).toString().replace('.', ',');

function applyLang() {
  const t = L();
  document.getElementById('h1').textContent = t.h1;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('showLbl').textContent = t.show;
  document.getElementById('note').textContent = t.note;
}

function paint() {
  applyLang();
  if (new URLSearchParams(location.search).get('grid')) {
    document.getElementById('frame').classList.add('grid');
  }
  const s = SCREENS[cur];
  if (!s) return;

  document.getElementById('img').src = assetUrl(s.file);
  document.getElementById('frame').classList.toggle('hidden', !showValues);

  document.getElementById('chips').innerHTML = (s.chips || []).map((c) => {
    const r = valueOf(c.val);
    const cls = r.bad ? ' bad' : ' ok';
    const style = 'left:' + c.x + '%;top:' + c.y + '%'
      + (c.w ? ';width:' + c.w + '%;height:' + c.h + '%' : '');
    return '<div class="chip' + cls + '" style="' + style + '" title="' + c.cap + ' ' + c.val + '">'
      + fmt(r.v) + ' ' + (c.unit || '') + '</div>';
  }).join('');

  // нижняя панель: родные вкладки АСУТП, доступные — кликабельны
  document.getElementById('deptbar').innerHTML = TABS.map((tb) => {
    const i = SCREENS.findIndex((x) => x.id === tb.screen);
    const here = i === cur;
    return '<button type="button" data-i="' + i + '"' + (i < 0 ? ' disabled' : '')
      + (here ? ' class="here"' : '') + '>' + tb.name + '</button>';
  }).join('');
  document.getElementById('deptbar').querySelectorAll('button[data-i]').forEach((b) => {
    const i = +b.dataset.i;
    if (i >= 0) b.onclick = () => { cur = i; paint(); };
  });
}

function assetUrl(p) {
  try { return self.A ? self.A(p) : p; } catch (e) { return p; }
}

document.getElementById('show').onchange = (e) => {
  showValues = e.target.checked;
  document.getElementById('frame').classList.toggle('hidden', !showValues);
};

fetch(assetUrl('mnemo/screens.json')).then((r) => r.json()).then((d) => {
  SCREENS = d.screens || [];
  TABS = d.tabs || [];
  const first = TABS.findIndex((x) => x.screen === SCREENS[0].id);
  cur = 0;
  paint();
}).catch(() => {
  document.getElementById('stage').innerHTML = '<p style="padding:12px;color:#8fa3b6">Не удалось загрузить mnemo/screens.json</p>';
});

window.addEventListener('message', (e) => {
  const d = e.data;
  if (d && d.__tmkLangChange) { lang = d.lang === 'uz' ? 'uz' : 'ru'; paint(); }
});
try {
  if (self.TmkLang && self.TmkLang.initChild) {
    self.TmkLang.initChild((lg) => { lang = lg === 'uz' ? 'uz' : 'ru'; paint(); });
  }
} catch (e) {}
</script>
</body>
</html>
