<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мнемосхемы — TMK</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111821; --panel2:#0e141b; --line:#1e2833;
    --ink:#e8eef5; --ink2:#a8b7c7; --ink3:#6f8093;
    --accent:#2fbf9a; --ok:#2fbf9a; --bad:#e05561;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;row-gap:6px}
  header .sp{flex:1 1 0;min-width:0}
  header .grp,header label{flex:0 0 auto;flex-wrap:wrap}
  header b{font-size:15px}
  header .sub{color:var(--ink3);font-size:12px}
  header .sp{margin-left:auto}
  header .grp{display:flex;gap:4px;align-items:center}
  header button{background:transparent;border:1px solid var(--line);color:var(--ink2);
    padding:5px 10px;border-radius:8px;font:inherit;font-size:12.5px;cursor:pointer}
  header button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06130f;font-weight:600}
  header label{display:flex;gap:6px;align-items:center;color:var(--ink2);font-size:12.5px}
  .wrap{display:flex;flex-direction:column;height:calc(100% - 46px)}
  .stage{position:relative;flex:1;overflow:auto;background:#05080b;padding:4px 4px 32px}
  .panes{display:grid;gap:5px;height:100%}
  .panes.n1{grid-template-columns:1fr}
  .panes.n2{grid-template-columns:1fr 1fr}
  .panes.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .pane{position:relative;border:1px solid #16212c;border-radius:4px;overflow:hidden;background:#05080b;
    display:flex;flex-direction:column;min-height:0}
  .pane.active{border-color:var(--accent)}
  .pane .top{display:flex;gap:4px;align-items:center;padding:2px 4px;background:#0d151d;font-size:11px;color:var(--ink3)}
  .pane .top .nm{color:var(--ink2);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pane .top button{background:transparent;border:0;color:var(--ink3);font:inherit;font-size:11px;
    padding:1px 5px;border-radius:4px;cursor:pointer}
  .pane .top button[aria-pressed="true"]{background:#1c2a38;color:#dff1ff}
  .pane .box{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;
    align-items:center;justify-content:center}
  /* Снимок вписывается целиком: высота задаёт ширину по пропорции 2:1,
     поэтому картинка видна полностью и без прокрутки в любой панели.
     Обёртка совпадает с картинкой, проценты чипов считаются от неё. */
  .pane .shot{position:relative;flex:0 0 auto}
  .pane img{display:block;width:100%;height:100%}
  .pane .chips{position:absolute;inset:0}

  /* чип ложится поверх поля значения и закрывает исходные нули */
  .chip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
    background:#060d13;border:1px solid #2f4356;border-radius:2px;padding:1px 2px;min-width:34px;
    font:600 11.5px/1 ui-monospace,Menlo,Consolas,monospace;color:#eaf4ff;white-space:nowrap;overflow:hidden}
  .chip.ok{color:#c8ffe9}
  .chip.bad{color:#ffb3b8;border-color:#7a2f36;background:#1a0b0e}
  /* управления процессом: меняют расчёт, значения на схемах едут за ними */
  .ctrls{display:flex;gap:14px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);
    background:var(--panel2);flex-wrap:wrap}
  .ctrls .f{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink3)}
  .ctrls input[type=range]{width:130px}
  .ctrls output{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:#dff1ff;min-width:44px;text-align:right}
  header .clock{font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;color:#cfe6ff;
    background:#0d151d;border:1px solid var(--line);border-radius:6px;padding:4px 7px}
  /* окно трендов */
  .trend{position:absolute;left:10px;right:10px;bottom:36px;height:230px;background:#0b131b;
    border:1px solid #2b4152;border-radius:8px;box-shadow:0 8px 24px #000a;z-index:8;display:none;
    flex-direction:column}
  .trend.on{display:flex}
  .trend .hd{display:flex;align-items:center;gap:10px;padding:6px 9px;border-bottom:1px solid #223243;
    font-size:12px;color:#cfe6ff}
  .trend .hd .sp{margin-left:auto}
  .trend .hd button{border:1px solid #2b4152;background:transparent;color:#9fb3c6;border-radius:5px;
    font-size:11px;padding:2px 7px;cursor:pointer}
  .trend .hd button.on{background:#1c2a38;color:#dff1ff}
  .trend canvas{flex:1;width:100%;display:block}
  /* тревоги */
  header button.alarm{border-color:#5a4a20;color:#f0d68a}
  header button.alarm.on{background:#8a2f36;border-color:#c05058;color:#fff}
  .awin{position:absolute;right:10px;top:10px;width:330px;background:#0c141c;border:1px solid #2b4152;
    border-radius:8px;box-shadow:0 8px 24px #000a;z-index:9;display:none}
  .awin.on{display:block}
  .awin .hd{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid #223243;
    font-size:12.5px;color:#cfe6ff}
  .awin .hd .x{margin-left:auto;cursor:pointer;color:#7f93a6;border:0;background:none;font-size:14px}
  .awin .bd{max-height:320px;overflow:auto;padding:6px 8px}
  .awin .it{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-bottom:1px solid #17232f;
    font-size:12px;color:#c7d6e5}
  .awin .it:last-child{border:0}
  .awin .it .dot{width:7px;height:7px;border-radius:50%;background:#e05561;margin-top:5px;flex:0 0 auto}
  .awin .it.acked .dot{background:#d8a13a}
  .awin .it .tx{flex:1}
  .awin .it .tx small{display:block;color:#7f93a6;font-size:11px;margin-top:1px}
  .awin .it button{border:1px solid #2b4152;background:transparent;color:#9fb3c6;border-radius:5px;
    font-size:11px;padding:2px 6px;cursor:pointer}
  .awin .ft{display:flex;gap:6px;padding:7px 9px;border-top:1px solid #223243}
  .awin .ft button{flex:1;border:1px solid #2b4152;background:transparent;color:#cfe6ff;border-radius:6px;
    padding:5px 0;font-size:12px;cursor:pointer}
  .awin .none{color:#6f8093;font-size:12px;padding:10px 4px;text-align:center}
  /* кликабельная арматура: невидимая рамка поверх значка */
  .spot{position:absolute;transform:translate(-50%,-50%);border:1px dashed rgba(120,200,255,.35);
    border-radius:3px;cursor:pointer;background:transparent;z-index:6}
  .spot:hover{border-color:var(--accent);background:rgba(47,191,154,.12)}
  .spot.pump{border-style:dotted}
  .hidden .spot{display:none}
  /* окно управления арматурой */
  .win{position:absolute;left:10px;bottom:36px;width:250px;background:#0c141c;border:1px solid #2b4152;
    border-radius:8px;box-shadow:0 8px 24px #000a;z-index:9;display:none}
  .win.on{display:block}
  .win .hd{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid #223243;
    font-size:12.5px;color:#cfe6ff}
  .win .hd b{font-weight:600}
  .win .hd .x{margin-left:auto;cursor:pointer;color:#7f93a6;border:0;background:none;font-size:14px}
  .win .bd{padding:9px}
  .win .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#9fb3c6;margin:4px 0}
  .win .row b{font-family:ui-monospace,Menlo,Consolas,monospace;color:#e6f4ff}
  .win input[type=range]{width:100%;margin:6px 0}
  .win .mode{display:flex;gap:6px;margin:6px 0}
  .win .mode button{flex:1;border:1px solid #2b4152;background:transparent;color:#9fb3c6;
    border-radius:6px;padding:4px 0;font-size:12px;cursor:pointer}
  .win .mode button.on{background:var(--accent);border-color:var(--accent);color:#06130f;font-weight:600}
  .win .note{font-size:11px;color:#6f8093;margin-top:6px}
  /* панель значений процесса: то, что считает наша модель, по этому экрану */
  .kpis{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:3px;
    background:rgba(6,12,18,.88);border:1px solid #24384a;border-radius:6px;padding:6px 8px;z-index:4;max-width:240px}
  .kpis .r{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:#9fb3c6}
  .kpis .r b{font:600 12px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#e6f4ff}
  .kpis .r b.bad{color:#ffb3b8}
  .hidden .chip{display:none}

  .deptbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1px;
    background:#dfe3e8;padding:1px;height:28px;align-items:stretch;overflow-x:auto}
  .deptbar button{flex:1 0 auto;border:0;background:#eceff3;color:#2b3947;
    font:400 11.5px/1 system-ui,sans-serif;padding:0 10px;cursor:pointer;
    white-space:nowrap;border-right:1px solid #c9cfd6}
  .deptbar button.here{background:#fff;color:#0b7a63;font-weight:700;box-shadow:inset 0 -2px 0 #0b7a63}
  .deptbar button[disabled]{color:#8d99a6;cursor:default}
  /* режим разметки: ?grid=1 */
  .pane.grid .box::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
    background:
      repeating-linear-gradient(to right, rgba(255,0,0,.55) 0 1px, transparent 1px 5%),
      repeating-linear-gradient(to bottom, rgba(255,0,0,.55) 0 1px, transparent 1px 5%),
      repeating-linear-gradient(to right, rgba(255,255,0,.9) 0 1px, transparent 1px 10%)}
  :fullscreen .wrap{height:100vh}

  /* узкие экраны: компактнее шапка, показатели — полосой снизу.
     Селекторы с # или .pane, потому что базовые правила объявлены ниже. */
  @media (max-width: 700px) {
    .pane .kpis{left:4px;right:4px;top:auto;bottom:4px;max-width:none;flex-direction:row;
      flex-wrap:wrap;gap:4px 10px;padding:4px 6px;background:rgba(6,12,18,.92)}
    .pane .kpis .r{font-size:10.5px;gap:4px}
    .pane .kpis .r b{font-size:11px}
    header{padding:6px 8px;gap:6px}
    header b{font-size:13.5px}
    header .sub,header .hint{display:none}
    header button{padding:4px 8px;font-size:11.5px}
    header .clock{padding:3px 6px;font-size:11.5px}
    .ctrls{padding:5px 8px;gap:8px}
    .ctrls .f{font-size:11px}
    .ctrls input[type=range]{width:96px}
    #win{width:210px;left:6px;bottom:32px}
    #awin{width:250px;right:6px;top:6px}
    .deptbar button{padding:0 6px;font-size:10.5px}
  }
  @media (max-height: 480px) {
    header{padding:4px 8px}
    header .sub,header .hint{display:none}
    .ctrls{padding:3px 8px}
    .pane .kpis{max-height:70%;overflow:auto;padding:3px 5px}
    .pane .kpis .r{font-size:10px}
  }
  @media (orientation: portrait) and (max-width: 820px) {
    /* снимок всё равно вписывается целиком — прокрутка не нужна */
    .pane .box{overflow:hidden}
  }
</style>
</head>
<body>
<header>
  <b id="h1">Мнемосхемы</b>
  <span class="sub" id="sub">расчётные значения на экранах АСУТП</span>
  <span class="sp"></span>
  <span class="grp" id="layouts">
    <button type="button" data-n="1" aria-pressed="true">1</button>
    <button type="button" data-n="2" aria-pressed="false">2</button>
    <button type="button" data-n="4" aria-pressed="false">4</button>
  </span>
  <span class="grp" id="eng">
    <button type="button" id="bPlay">▶</button>
    <button type="button" id="bSp1" aria-pressed="true">×1</button>
    <button type="button" id="bSp2" aria-pressed="false">×2</button>
    <button type="button" id="bSp5" aria-pressed="false">×5</button>
    <span class="clock" id="clock">00:00:00</span>
    <button type="button" id="bTrend">∿ тренд</button>
  </span>
  <button type="button" id="bAlm" class="alarm">🔔 0</button>
  <button type="button" id="fs">⛶ полный экран</button>
  <label><input type="checkbox" id="show"> <span id="showLbl">значения</span></label>
</header>
<div class="wrap">
  <div class="ctrls" id="ctrls">
    <span class="f"><label for="c-s">Подача серы</label><input type="range" id="c-s" min="5" max="32" step="0.5" value="20.48"><output id="o-s">20,5</output><span>т/ч</span></span>
    <span class="f"><label for="c-a">Избыток воздуха</label><input type="range" id="c-a" min="70" max="130" step="1" value="100"><output id="o-a">100</output><span>%</span></span>
  </div>
  <div class="stage" id="stage">
    <div class="trend" id="trend">
      <div class="hd"><b>Тренды</b>
        <span class="sp"></span>
        <button type="button" data-tag="кислота" class="on">кислота</button>
        <button type="button" data-tag="конверсия" class="on">конверсия</button>
        <button type="button" data-tag="SO₂" class="on">SO₂</button>
        <button type="button" data-tag="уровень">уровень</button>
        <button type="button" id="trClose">✕</button>
      </div>
      <canvas id="trCanvas"></canvas>
    </div>
    <div class="awin" id="awin">
      <div class="hd"><b>Тревоги процесса</b><button class="x" id="aClose">✕</button></div>
      <div class="bd" id="aList"></div>
      <div class="ft"><button id="aAck">Квитировать все</button></div>
    </div>
    <div class="win" id="win">
      <div class="hd"><b id="wTitle">—</b><button class="x" id="wClose">✕</button></div>
      <div class="bd">
        <div class="mode"><button id="wA" class="on">A — авто</button><button id="wM">M — ручной</button></div>
        <div class="row"><span>Положение</span><b><span id="wPos">0</span> %</b></div>
        <input type="range" id="wSlider" min="0" max="100" step="1" value="0">
        <div class="row"><span>Расход серы</span><b><span id="wFlow">—</span> т/ч</b></div>
        <div class="note" id="wNote"></div>
      </div>
    </div>
    <div class="panes n1" id="panes"></div>
    <div class="deptbar" id="deptbar"></div>
  </div>
</div>

<!-- модули двойника: порядок важен -->
<script src="twin/heatcap.js"></script>
<script src="twin/converter.js"></script>
<script src="twin/model.js"></script>
<script src="twin/dcs-signals.data.js"></script>
<script src="twin/tank.js"></script>
<script src="twin/vessels.js"></script>
<script src="twin/heat.js"></script>
<script src="twin/alarms.js"></script>
<script src="twin/water.js"></script>
<script src="twin/engine.js"></script>
<script src="twin/melt.js"></script>

<script src="lang.js"></script>
<script>
'use strict';
const TXT = {
  ru: { h1: 'Мнемосхемы', sub: 'расчётные значения на экранах АСУТП', show: 'значения',
        fs: '⛶ полный экран', fsOff: '⤡ свернуть', pick: 'Экран для панели' },
  uz: { h1: 'Mnemoyxemalar', sub: 'АSU TP ekranlarida hisobiy qiymatlar', show: 'qiymatlar',
        fs: '⛶ to‘liq ekran', fsOff: '⤡ kichraytirish', pick: 'Panel uchun ekran' }
};
let lang = 'ru';
const L = () => TXT[lang] || TXT.ru;

let SCREENS = [];
let TABS = [];
let layout = 1;          // 1 | 2 | 4 панели
let panes = [];          // индексы экранов в панелях
let active = 0;          // активная панель
let showValues = true;
const GRID = new URLSearchParams(location.search).get('grid');

const NOMINAL_S = 20.48;
const S_DENSITY = 1.792;

/** Значение для чипа. */
function valueOf(key) {
  const M = self.TwinMelt, V = self.TwinVessels;
  const melt = M ? M.solve({ sulfur_t_h: CTRL.sulfur, ashFeed: 120 }) : null;

  if (key.startsWith('level:')) {
    const tag = key.slice(6);
    const row = V ? V.list({}, lang).find((x) => x.tag === tag) : null;
    return row ? { v: row.level, bad: row.status !== 'normal' && row.status !== 'none' } : { v: null };
  }
  if (key.startsWith('const:')) return { v: parseFloat(key.slice(6)) };
  if (key === 'speed') return { v: 100 };
  if (key.startsWith('speed:')) {
    const parts = key.slice(6).split(':');
    const cap = parseFloat(parts[0]);
    const n = parts[1] ? parseInt(parts[1], 10) : 1;
    if (!(cap > 0) || !(n > 0)) return { v: null };
    return { v: Math.min(120, ((NOMINAL_S / n) / cap) * 100) };
  }
  if (key === 'valve') return { v: 100 };
  if (key === 'flow.m3') return { v: melt ? melt.sulfur_t_h / S_DENSITY : null };
  if (key === 'melt.sulfur') return { v: melt ? melt.sulfur_t_h : null };
  // общезаводские величины из нашего расчёта
  const MD = MODEL || {};
  if (key === 'acid') return { v: MD.acid ? MD.acid.product_t_h : null };
  if (key === 'conv') return { v: MD.conversion != null ? MD.conversion : null };
  if (key === 'so2') return { v: MD.stack ? MD.stack.so2_mg : null, bad: MD.stack ? MD.stack.so2_mg > 300 : false };
  if (key === 'conc') return { v: MD.acid ? MD.acid.conc : null };
  if (key === 'scrub') return { v: 47 };
  if (key === 'ash') return { v: melt ? melt.ash.after2Ppm : null };
  if (key === 'steam') return { v: HEAT ? HEAT.steam_t_h : null };
  if (key === 'extract') return { v: HEAT ? HEAT.extraction_t_h : null };
  if (key === 'turbine') return { v: HEAT ? HEAT.turbinePowerMw : null };
  if (key === 'heat') return { v: HEAT ? HEAT.heatMw : null };
  if (key === 'feedwater') return { v: HEAT ? HEAT.feedwater_t_h : null };
  if (key === 'blowdown') return { v: HEAT ? HEAT.blowdown_t_h : null };
  if (key === 'net') return { v: WATER ? WATER.netMw : null };
  if (key === 'gross') return { v: WATER ? WATER.grossMw : null };
  if (key === 'condduty') return { v: WATER ? WATER.condDutyMw : null };
  if (key === 'circpower') return { v: WATER ? WATER.circPower_m3_h : null };
  if (key === 'circacid') return { v: WATER ? WATER.circAcid_m3_h : null };
  if (key === 'makeup') return { v: WATER ? WATER.makeup_t_h : null };
  if (key === 'steamacid') return { v: WATER ? WATER.steamPerAcid : null };
  if (key === 'melt.tMelt') return { v: melt ? melt.tMelt : null };
  if (key === 'melt.steam08') return { v: melt ? melt.steam08_t_h : null };
  return { v: null };
}

const CTRL = { sulfur: 20.48, air: 1.0, valve: 64, valveAuto: true };
const VALVE_MAX_T_H = 32;   // 100 % клапана = 32 т/ч серы
let WIN = null;             // { tag, kind, link } открытого окна
const AL = self.TwinAlarms ? self.TwinAlarms.create() : null;
let ENG = null;          // движок времени
let MEM = null;          // память блокировок
let lastPaint = 0;
const NOM = 20.48;

let MODEL = null;      // расчёт модели, один на отрисовку
let HEAT = null;       // тепловой блок
let WATER = null;      // вода, циркуляция, генерация

function fmt(v, d) {
  if (v == null || !isFinite(v)) return '—';
  const k = 10 ** (d == null ? 1 : d);
  return (Math.round(v * k) / k).toString().replace('.', ',');
}
function assetUrl(p) { try { return self.A ? self.A(p) : p; } catch (e) { return p; } }

function chipHtml(c) {
  const r = valueOf(c.val);
  const cls = r.bad ? ' bad' : ' ok';
  const style = 'left:' + c.x + '%;top:' + c.y + '%'
    + (c.w ? ';width:' + c.w + '%;height:' + c.h + '%' : '');
  return '<div class="chip' + cls + '" style="' + style + '" title="' + c.cap + '">'
    + fmt(r.v) + ' ' + (c.unit || '') + '</div>';
}

/** Разметка одной панели: заголовок с выбором экрана, картинка, чипы. */
function paneHtml(screenIdx, paneIdx) {
  const s = SCREENS[screenIdx];
  if (!s) return '';
  const tabs = SCREENS.map((x, i) =>
    '<button type="button" data-pane="' + paneIdx + '" data-scr="' + i + '"'
    + (i === screenIdx ? ' aria-pressed="true"' : '') + '>' + (x.dept || x.id) + '</button>').join('');
  return '<div class="pane' + (paneIdx === active ? ' active' : '') + (GRID ? ' grid' : '')
    + (showValues ? '' : ' hidden') + '" data-pane="' + paneIdx + '">'
    + '<div class="top"><span class="nm">' + (s.title[lang] || s.title.ru) + '</span>'
    + (layout > 1 ? tabs : '') + '</div>'
    + '<div class="box"><div class="shot"><img src="' + assetUrl(s.file) + '" alt="">'
    + '<div class="chips">' + (s.chips || []).map(chipHtml).join('') + '</div>'
    + (s.spots || []).map((sp) => '<div class="spot' + (sp.kind === 'pump' ? ' pump' : '')
      + '" data-sp="' + sp.id + '" data-tag="' + sp.tag + '" data-kind="' + sp.kind
      + '" data-link="' + (sp.link || '') + '" title="' + sp.tag
      + '" style="left:' + sp.x + '%;top:' + sp.y + '%;width:' + sp.w + '%;height:' + sp.h + '%"></div>').join('')
    + ((s.kpis && s.kpis.length) ? '<div class="kpis">' + s.kpis.map((k) => {
      const r = valueOf(k.val);
      return '<div class="r"><span>' + k.label + '</span><b' + (r.bad ? ' class="bad"' : '')
        + '>' + fmt(r.v) + ' ' + (k.unit || '') + '</b></div>';
    }).join('') + '</div>' : '')
    + '</div></div></div>';
}

function paint() {
  // расчёт модели — один раз на отрисовку, из него берут значения все панели
  try {
    MODEL = self.TwinModel ? self.TwinModel.solve({ load: CTRL.sulfur / NOM, air_excess: CTRL.air }) : null;
    HEAT = (self.TwinHeat && MODEL) ? self.TwinHeat.solve(MODEL) : null;
    WATER = (self.TwinWater && HEAT) ? self.TwinWater.solve(HEAT, MODEL) : null;
  } catch (e) { MODEL = null; HEAT = null; WATER = null; }
  const t = L();
  document.getElementById('h1').textContent = t.h1;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('showLbl').textContent = t.show;
  document.getElementById('fs').textContent = document.fullscreenElement ? t.fsOff : t.fs;

  const box = document.getElementById('panes');
  box.className = 'panes n' + layout;
  panes.length = Math.min(panes.length, layout);   // при возврате 4 → 1 лишние панели убираем
  while (panes.length < layout) panes.push(panes.length % Math.max(1, SCREENS.length));
  active = Math.min(active, panes.length - 1);
  box.innerHTML = panes.slice(0, layout).map((si, pi) => paneHtml(si, pi)).join('');

  fitShots();

  // тревоги считаем по текущему расчёту и уровням
  if (AL && MODEL) {
    AL.update(MODEL, self.TwinVessels ? self.TwinVessels.list({}, lang) : []);
    paintAlarms();
  }

  // выбор экрана внутри панели
  box.querySelectorAll('button[data-scr]').forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      panes[+b.dataset.pane] = +b.dataset.scr;
      active = +b.dataset.pane;
      paint();
    };
  });
  // клик по арматуре открывает окно управления
  box.querySelectorAll('.spot').forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      openWin({ tag: el.dataset.tag, kind: el.dataset.kind, link: el.dataset.link });
    };
  });

  // клик по панели делает её активной
  box.querySelectorAll('.pane').forEach((p) => {
    p.onclick = () => { active = +p.dataset.pane; paint(); };
  });

  // нижняя панель отделений управляет активной панелью
  const curScreen = panes[active];
  document.getElementById('deptbar').innerHTML = TABS.map((tb) => {
    const i = SCREENS.findIndex((x) => x.id === tb.screen);
    const here = i === curScreen;
    return '<button type="button" data-i="' + i + '"' + (i < 0 ? ' disabled' : '')
      + (here ? ' class="here"' : '') + '>' + tb.name + '</button>';
  }).join('');
  document.getElementById('deptbar').querySelectorAll('button[data-i]').forEach((b) => {
    const i = +b.dataset.i;
    if (i >= 0) b.onclick = () => { panes[active] = i; paint(); };
  });
}


// --- движок времени и тренды ---------------------------------------------
const TREND_ON = new Set(['кислота', 'конверсия', 'SO₂']);
const TREND_COLORS = {
  'кислота': '#59d0a8', 'конверсия': '#7fb2ff', 'SO₂': '#e8a13a', 'уровень': '#c9a2ff',
};

/** Вписать каждую мнемосхему в её панель целиком, без прокрутки.
 *  Пропорция снимков 2:1 — считаем размер сами, чтобы картинка и слой
 *  чипов совпадали пиксель в пиксель. */
function fitShots() {
  const panes = document.querySelectorAll('#panes .pane');
  panes.forEach((p) => {
    const box = p.querySelector('.box');
    const shot = p.querySelector('.shot');
    if (!box || !shot) return;
    const w = box.clientWidth;
    const h = box.clientHeight;
    if (!w || !h) return;
    const R = 2;
    const W = Math.min(w, h * R);
    const H = Math.round(W / R);
    shot.style.width = Math.round(W) + 'px';
    shot.style.height = H + 'px';
  });
}

let fitTimer = 0;
function scheduleFit() {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitShots, 60);
}
window.addEventListener('resize', scheduleFit);
window.addEventListener('orientationchange', scheduleFit);

function fmtClock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = Math.floor(sec % 60);
  const p = (n) => String(n).padStart(2, '0');
  return p(h) + ':' + p(m) + ':' + p(x);
}

function startEngine() {
  if (!self.TwinEngine || !self.TwinModel) return;
  const T = self.TwinModel, St = self.TwinState, LG = self.TwinLogic, V = self.TwinVessels;
  MEM = (LG && LG.makeMemory) ? LG.makeMemory() : null;
  ENG = self.TwinEngine.create({
    compute: (c) => T.solve(c),
    controls: () => ({ load: CTRL.sulfur / NOM, air_excess: CTRL.air }),
    vessels: V,
    series: (p) => {
      if (!p || p.error) return {};
      return {
        'кислота': p.acid ? p.acid.product_t_h : null,
        'конверсия': p.conversion,
        'SO₂': p.stack ? p.stack.so2_mg : null,
        'уровень': V ? (V.list({}, lang).find((x) => x.tag === 'LT-11101') || {}).level : null,
      };
    },
    interlocks: (LG && self.TWIN_ILK) ? {
      evaluate: (p) => LG.evaluate(self.TWIN_ILK, St.build(p, V ? V.forState() : {}), MEM),
    } : null,
  });
  ENG.state.historyEvery = 1;

  let last = performance.now();
  setInterval(() => {
    const now = performance.now();
    const dt = now - last;
    last = now;
    if (!ENG) return;
    ENG.advance(dt);
    const sn = ENG.snap();
    const cl = document.getElementById('clock');
    if (cl) cl.textContent = fmtClock(sn.t);
    if (sn.last && AL) { AL.update(sn.last, V ? V.list({}, lang) : []); paintAlarms(); }
    if (sn.t - lastPaint >= 2) { lastPaint = sn.t; drawTrend(); }
  }, 250);
}

function bindEngine() {
  const play = document.getElementById('bPlay');
  play.onclick = () => {
    if (!ENG) return;
    if (ENG.state.paused) { ENG.play(); play.textContent = '⏸'; }
    else { ENG.pause(); play.textContent = '▶'; }
    paint();
  };
  [['bSp1', 1], ['bSp2', 2], ['bSp5', 5]].forEach(([id, v]) => {
    const el = document.getElementById(id);
    el.onclick = () => {
      if (!ENG) return;
      ENG.setSpeed(v);
      document.querySelectorAll('#eng button[id^=bSp]').forEach((b) =>
        b.setAttribute('aria-pressed', b === el ? 'true' : 'false'));
    };
  });
  document.getElementById('bTrend').onclick = () => {
    document.getElementById('trend').classList.toggle('on');
    drawTrend();
  };
  document.getElementById('trClose').onclick = () => document.getElementById('trend').classList.remove('on');
  document.querySelectorAll('#trend .hd button[data-tag]').forEach((b) => {
    b.onclick = () => {
      const t = b.dataset.tag;
      if (TREND_ON.has(t)) TREND_ON.delete(t); else TREND_ON.add(t);
      b.classList.toggle('on', TREND_ON.has(t));
      drawTrend();
    };
  });
}

/** График: по горизонтали модельное время, по вертикали — значение. */
function drawTrend() {
  const cv = document.getElementById('trCanvas');
  if (!cv || !ENG) return;
  const box = cv.getBoundingClientRect();
  if (!box.width) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(box.width * dpr) || cv.height !== Math.round(box.height * dpr)) {
    cv.width = Math.round(box.width * dpr);
    cv.height = Math.round(box.height * dpr);
  }
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);

  const tags = [...TREND_ON];
  const series = tags.map((t) => ({ tag: t, data: ENG.history(t), color: TREND_COLORS[t] || '#888' }))
    .filter((s) => s.data.length > 1);

  // сетка
  ctx.strokeStyle = 'rgba(120,150,180,.14)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    const y = (H / 5) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  if (!series.length) {
    ctx.fillStyle = '#6f8093';
    ctx.font = (12 * dpr) + 'px system-ui,sans-serif';
    ctx.fillText('Пуск модели — и здесь появятся кривые', 12 * dpr, 22 * dpr);
    return;
  }

  const t0 = Math.min(...series.map((s) => s.data[0].t));
  const t1 = Math.max(...series.map((s) => s.data[s.data.length - 1].t));
  const span = Math.max(1, t1 - t0);

  series.forEach((s, idx) => {
    const vals = s.data.map((d) => d.v);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max - min < 1e-6) { max = min + 1; }
    const pad = (max - min) * 0.12;
    min -= pad; max += pad;

    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1.6 * dpr;
    ctx.beginPath();
    s.data.forEach((d, i) => {
      const x = ((d.t - t0) / span) * (W - 8) + 4;
      const y = H - ((d.v - min) / (max - min)) * (H - 10) - 5;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // подпись серии
    ctx.fillStyle = s.color;
    ctx.font = (11 * dpr) + 'px system-ui,sans-serif';
    const lastV = s.data[s.data.length - 1].v;
    ctx.fillText(s.tag + ' ' + fmt(lastV) + (s.tag === 'кислота' ? ' т/ч' : s.tag === 'SO₂' ? ' мг/нм³' : ' %'),
      8 * dpr, (14 + idx * 14) * dpr);
  });

  // метки времени
  ctx.fillStyle = '#7f93a6';
  ctx.font = (10 * dpr) + 'px system-ui,sans-serif';
  ctx.fillText(fmtClock(t0), 6 * dpr, H - 6 * dpr);
  const end = fmtClock(t1);
  ctx.fillText(end, W - ctx.measureText(end).width - 6 * dpr, H - 6 * dpr);
}


function paintAlarms() {
  if (!AL) return;
  const list = AL.list();
  const pending = AL.pending().length;
  const bell = document.getElementById('bAlm');
  if (bell) {
    bell.textContent = '🔔 ' + pending;
    bell.classList.toggle('on', pending > 0);
  }
  const box = document.getElementById('aList');
  if (!box) return;
  box.innerHTML = list.length ? list.map((a) =>
    '<div class="it' + (a.ack ? ' acked' : '') + '"><span class="dot"></span><span class="tx">'
    + a.title + '<small>' + (a.detail || '') + '</small></span>'
    + (a.ack ? '' : '<button data-ack="' + a.id + '">квит.</button>') + '</div>').join('')
    : '<div class="none">Активных тревог нет</div>';
  box.querySelectorAll('button[data-ack]').forEach((b) => {
    b.onclick = () => { AL.ack(b.dataset.ack); paintAlarms(); };
  });
}

document.getElementById('bAlm').onclick = () => {
  document.getElementById('awin').classList.toggle('on');
  paintAlarms();
};
document.getElementById('aClose').onclick = () => document.getElementById('awin').classList.remove('on');
document.getElementById('aAck').onclick = () => { if (AL) { AL.ackAll(); paintAlarms(); } };

function openWin(sp) {
  WIN = sp;
  const win = document.getElementById('win');
  win.classList.add('on');
  document.getElementById('wTitle').textContent = sp.tag + (sp.kind === 'pump' ? ' · насос' : ' · клапан');
  const linked = sp.link === 'sulfur';
  document.getElementById('wNote').textContent = linked
    ? 'Связан с расходом серы: положение меняет подачу и пересчитывает весь расчёт.'
    : 'Модель этого аппарата пока не считает — окно показывает состояние.';
  const slider = document.getElementById('wSlider');
  slider.disabled = !linked;
  if (linked) {
    slider.value = String(CTRL.valve);
    document.getElementById('wPos').textContent = String(Math.round(CTRL.valve));
    document.getElementById('wFlow').textContent = fmt(CTRL.sulfur);
  } else {
    slider.value = '100';
    document.getElementById('wPos').textContent = '100';
    document.getElementById('wFlow').textContent = '—';
  }
  const setMode = (auto) => {
    CTRL.valveAuto = auto;
    document.getElementById('wA').classList.toggle('on', auto);
    document.getElementById('wM').classList.toggle('on', !auto);
    slider.disabled = auto || !linked;
  };
  setMode(linked ? CTRL.valveAuto : false);
  document.getElementById('wA').onclick = () => setMode(true);
  document.getElementById('wM').onclick = () => setMode(false);
  slider.oninput = (e) => {
    if (!linked) return;
    CTRL.valve = parseFloat(e.target.value);
    CTRL.sulfur = (CTRL.valve / 100) * VALVE_MAX_T_H;
    document.getElementById('wPos').textContent = String(Math.round(CTRL.valve));
    document.getElementById('wFlow').textContent = fmt(CTRL.sulfur);
    const s = document.getElementById('c-s');
    if (s) { s.value = String(CTRL.sulfur.toFixed(1)); document.getElementById('o-s').textContent = fmt(CTRL.sulfur); }
    paint();
  };
}

document.getElementById('wClose').onclick = () => {
  document.getElementById('win').classList.remove('on');
  WIN = null;
};

function bindControls() {
  const fs = document.getElementById('c-s');
  const fa = document.getElementById('c-a');
  fs.value = String(CTRL.sulfur);
  document.getElementById('o-s').textContent = fmt(CTRL.sulfur);
  fs.oninput = (e) => {
    CTRL.sulfur = parseFloat(e.target.value);
    document.getElementById('o-s').textContent = fmt(CTRL.sulfur);
    paint();
  };
  fa.oninput = (e) => {
    CTRL.air = parseFloat(e.target.value) / 100;
    document.getElementById('o-a').textContent = String(Math.round(CTRL.air * 100));
    paint();
  };
}
bindControls();

document.getElementById('show').onchange = (e) => {
  showValues = e.target.checked;
  paint();
};

// 1 / 2 / 4 панели
document.getElementById('layouts').querySelectorAll('button').forEach((b) => {
  b.onclick = () => {
    layout = +b.dataset.n;
    document.querySelectorAll('#layouts button').forEach((x) =>
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    if (panes.length < layout) {
      for (let i = panes.length; i < layout; i++) panes.push(i % Math.max(1, SCREENS.length));
    }
    active = Math.min(active, layout - 1);
    paint();
  };
});

// полный экран
document.getElementById('fs').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) {
    // в iframe без allowfullscreen полноэкранный режим запрещён — просим оболочку
    try { parent.postMessage({ __tmkFullscreen: true, on: !document.fullscreenElement }, '*'); } catch (e2) {}
  }
  setTimeout(paint, 120);
};
document.addEventListener('fullscreenchange', () => paint());

fetch(assetUrl('mnemo/screens.json')).then((r) => r.json()).then((d) => {
  SCREENS = d.screens || [];
  TABS = d.tabs || [];
  panes = [0];
  paint();
  bindEngine();
  startEngine();
  try {
    const ro = new ResizeObserver(() => scheduleFit());
    ro.observe(document.getElementById('panes'));
  } catch (e) {}
}).catch(() => {
  document.getElementById('stage').innerHTML =
    '<p style="padding:12px;color:#8fa3b6">Не удалось загрузить mnemo/screens.json</p>';
});

window.addEventListener('message', (e) => {
  const d = e.data;
  if (d && d.__tmkLangChange) { lang = d.lang === 'uz' ? 'uz' : 'ru'; paint(); }
});
try {
  if (self.TmkLang && self.TmkLang.initChild) {
    self.TmkLang.initChild((lg) => { lang = lg === 'uz' ? 'uz' : 'ru'; paint(); });
  }
} catch (e) {}
</script>
