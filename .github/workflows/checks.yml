# Проверки целостности проекта.
# Запускается на каждый pull request и на каждый пуш в main.
# Ловит то, что глазами не видно: битые ссылки и картинки, синтаксис,
# расхождение service-worker.js с файлами на диске, неполный индекс PDF.
name: Проверки

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Имя задания задано явно: от него зависит имя статус-проверки, которое
    # требует ruleset (.github/rulesets/main-protection-strict.json).
    # Не переименовывать, не согласовав с ruleset.
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверки целостности
        run: node tools/ci-check.js

      # Модель двойника обязана воспроизводить проектный баланс: если разойдётся,
      # значит в расчётах ошибка, и на таких цифрах строить прогноз нельзя.
      - name: Сверка модели с проектным балансом
        run: node twin/selftest.js

      # Логика блокировок: условия, связки or/and/2oo3, латчи, BYPASS.
      - name: Проверка вычислителя блокировок
        run: node twin/interlocks.selftest.js
