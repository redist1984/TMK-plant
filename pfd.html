<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFD — технологическая схема материальных потоков</title>
<script>try{var __t=localStorage.getItem('tmk_theme');if(__t==='light'||__t==='dark')document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
<style>
:root{
  --bg:#EEF2F1; --panel:#FFFFFF; --panel2:#F6F8F8; --ink:#14201D; --ink2:#4A5A55; --ink3:#72827D;
  --line:#CBD5D2; --accent:#0B6E66; --accent-ink:#FFFFFF; --paper:#FFFFFF;
  --s-water:#23873A; --s-steam:#C9302A; --s-steamlp:#2DB4F0; --s-air:#2362C0; --s-gas:#C79A00; --s-acid:#DD6A12;
  --s-alkali:#7A4DB8; --s-sulfur:#8A5A2B;
  --shadow:0 10px 30px rgba(20,32,29,.16);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --imgfilter:none; --eqf:#F2F6F5; --hatch:#B9C4C1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1614; --panel:#16201D; --panel2:#1B2623; --ink:#E3ECE9; --ink2:#A9B8B3; --ink3:#7F908B;
    --line:#2C3A36; --accent:#3FC1B3; --accent-ink:#06201C; --paper:#121A18;
    --s-water:#4CC265; --s-steam:#FF6B5E; --s-steamlp:#7CCBFA; --s-air:#5B9BFF; --s-gas:#F2C230; --s-acid:#FF9A45;
    --s-alkali:#B18CF0; --s-sulfur:#C99158;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    --imgfilter:invert(.9) hue-rotate(180deg) brightness(1.05); --eqf:#1B2724; --hatch:#3B4A46;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1614; --panel:#16201D; --panel2:#1B2623; --ink:#E3ECE9; --ink2:#A9B8B3; --ink3:#7F908B;
  --line:#2C3A36; --accent:#3FC1B3; --accent-ink:#06201C; --paper:#121A18;
  --s-water:#4CC265; --s-steam:#FF6B5E; --s-steamlp:#7CCBFA; --s-air:#5B9BFF; --s-gas:#F2C230; --s-acid:#FF9A45;
  --s-alkali:#B18CF0; --s-sulfur:#C99158;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --imgfilter:invert(.9) hue-rotate(180deg) brightness(1.05); --eqf:#1B2724; --hatch:#3B4A46;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-weight:500;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-weight:500;font-size:12.5px;cursor:pointer}
.btn:active{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.zoom{display:inline-flex;flex:0 0 auto;align-items:center;gap:4px;margin-left:auto}
.zoom button{width:32px;height:32px;padding:0;font-size:17px;line-height:1}
.zoom .zl{font:600 12px var(--mono);min-width:46px;text-align:center;color:var(--ink2)}
#q{flex:1 1 150px;min-width:120px;max-width:260px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;font-size:13px}
.main{position:relative;flex:1 1 auto;min-height:0;display:flex}
#vp{position:relative;flex:1 1 auto;overflow:hidden;background:var(--paper);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#vp.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage.anim{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#stage img{position:absolute;inset:0;display:none;width:100%;height:100%;filter:var(--imgfilter);pointer-events:none;-webkit-user-drag:none;opacity:.5;z-index:2}
body.scan #stage img,body.cmp #stage img{display:block}
body.scan #stage img{opacity:1}
body.scan:not(.scanwait) #art{visibility:hidden}
#scanNote{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
#scanNote.err{border-color:#c0392b;color:#c0392b}
#scanNote[hidden]{display:none}
#art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#art .ln{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#art .fl{fill:var(--ink);stroke:none}
#art .sb{fill:var(--eqf);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
#art .sl{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#art .sl2{fill:none;stroke:var(--ink);stroke-width:3}
#art .sl0{fill:none;stroke:var(--ink);stroke-width:3}
#art .st{fill:none;stroke:var(--ink2);stroke-width:1.7}
#art .sf{fill:var(--ink);stroke:none}
#art .sx{fill:var(--hatch);fill-opacity:.45;stroke:none}
#art .sd{fill:url(#pfdD);stroke:var(--ink);stroke-width:2}
#art .sd2{fill:url(#pfdH);stroke:none}
#art .sd3{fill:url(#pfdN);stroke:none}
#art .sc{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-dasharray:10 6;stroke-linecap:round;stroke-linejoin:round}
#art .sc0{fill:none;stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
#art .sdb{fill:none;stroke:var(--ink2);stroke-width:2.6;stroke-dasharray:14 8}
#art .sn2{font:700 24px var(--sans);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
#art .fire{fill:#E8742A;stroke:var(--ink);stroke-width:1.6}
#art .pp{stroke-width:7;stroke-linecap:butt;fill:none}
#art .dsh{fill:none;stroke:var(--ink2);stroke-width:2.4;stroke-dasharray:30 12 3 12}
#art .dsm{fill:none;stroke:var(--ink2);stroke-width:2.2;stroke-dasharray:22 7 3 7}
#art .vl{fill:var(--paper);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
#art .dm{fill:var(--paper);stroke:var(--ink);stroke-width:2.4}
#art .dn{font:700 25px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
#art .ref .dm{stroke-dasharray:5 4}
#art .tg{font:700 22px var(--mono);fill:var(--accent);text-anchor:middle}
#stage:not(.zoomed) #art .tg,#art .tn,#art .tm{paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
#art .tn{display:none}
#art .tn{font:500 18px var(--sans);fill:var(--ink2);text-anchor:middle}
#art .tmn{fill:var(--paper);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
#art .tm{font:500 19px var(--sans);fill:var(--ink)}
#art .off{display:none}
#art .de{opacity:.3}
#ov .stz.off{pointer-events:none}
#ov .eqz.dz{opacity:.3}
.leg{display:inline-flex;flex-wrap:wrap;gap:4px}
.leg button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px 3px 7px;font-size:12px;cursor:pointer}
.leg button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.leg i{width:10px;height:10px;border-radius:50%;background:var(--c)}
#ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.eqz{fill:transparent;stroke:var(--accent);stroke-width:2;stroke-dasharray:10 7;stroke-opacity:.0;vector-effect:non-scaling-stroke;cursor:pointer}
body.zones .eqz{stroke-opacity:.5}
.eqz:hover{fill:var(--accent);fill-opacity:.12;stroke-opacity:1}
.eqz.sel{fill:var(--accent);fill-opacity:.18;stroke-opacity:1;stroke-dasharray:none;stroke-width:3}
.stz{fill:transparent;cursor:pointer}
.stz:hover{fill:var(--accent);fill-opacity:.22}
.stz.sel{fill:none;stroke:var(--accent);stroke-width:3;vector-effect:non-scaling-stroke}
body.zones .stz{stroke:var(--accent);stroke-opacity:.0}
.hl line{stroke-linecap:round;opacity:.78}
.hl .glow{opacity:.28}
#tip{position:absolute;z-index:5;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px 9px;font-size:12.5px;max-width:300px;display:none}
#tip b{font-family:var(--mono);font-size:12px}
#tip small{display:block;color:var(--ink2);font-size:11.5px}
#card{flex:0 0 340px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 14px 22px;display:none}
#card.open{display:block}
#card.open~.hint,.main:has(#card.open) .hint{display:none}
#card .x{float:right;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--ink2);padding:2px 6px}
.eyebrow{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
#card h2{font-size:17px;line-height:1.25;margin:4px 0 8px}
.tag{font:600 12.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--ink2);margin:2px 4px 2px 0}
.pill.ok{border-color:var(--accent);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0}
.kv dt{color:var(--ink3);font-size:12.5px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.specs{margin:8px 0;padding-left:18px;color:var(--ink2);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.chips button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 10px;font:600 12px var(--mono);cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.acts{display:flex;flex-direction:column;gap:7px;margin:12px 0}
.acts .btn{text-align:left;padding:9px 12px}
.note{font-size:12px;color:var(--ink3);margin:10px 0 0}
.regmini{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.regmini td{border-top:1px solid var(--line);padding:4px 0;vertical-align:top}
.regmini td:first-child{color:var(--ink2);padding-right:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.hint{position:absolute;left:10px;bottom:10px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--ink2);max-width:calc(100% - 20px);pointer-events:none;opacity:.92}

#io{flex:0 0 auto;max-height:40%;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel)}
#io[hidden]{display:none}
#io .ioh{display:flex;align-items:center;gap:8px;padding:6px 10px;flex:0 0 auto}
#io .ioh b{font-size:13px}
#io .ioh span{color:var(--ink3);font-size:12px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#io .ioh button{border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:12.5px;padding:3px 8px;border-radius:6px}
#io .ioh button:hover{background:var(--panel2)}
#io.min .iob{display:none}
.iob{display:flex;gap:10px;overflow:auto;padding:0 10px 10px;align-items:flex-start}
.ioc{flex:0 0 auto;min-width:min(100%,470px);max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px 10px}
.ioc h3{margin:0 0 6px;font-size:13px;line-height:1.3}
.ioc h3 .tag{margin-right:6px}
.iot{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.iot th{font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:3px 6px 3px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.iot th.r,.iot td.r{text-align:right}
.iot td{padding:3px 6px 3px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.iot tr.sec td{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding-top:8px;border-bottom:0}
.iot tr.sec.in td{color:var(--s-water)}
.iot tr.sec.out td{color:var(--s-alkali)}
.iot tr[data-id]{cursor:pointer}
.iot tr[data-id]:hover td,.iot tr.act td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.iot td.n b{font-family:var(--mono)}
.iot td small{color:var(--ink3)}
.iot tr.sum td{font-weight:600;border-bottom:0}
.iot tr.bal td{font-weight:600}
.iot tr.bal.warn td{color:#c0392b}
.iot tr.bal.good td{color:var(--accent)}
.ionote{margin:6px 0 0;font-size:11.5px;color:var(--ink3)}
@media (max-width:760px){body.ioopen #card{display:none}#io{max-height:46%}.ioc{min-width:calc(100vw - 22px)}.iot td.nm{max-width:110px}}
@media (max-width:760px){
  .leg{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;order:3;padding-bottom:2px}
  .leg button{flex:0 0 auto;white-space:nowrap}
  #card{position:absolute;left:0;right:0;bottom:0;flex:none;max-height:52%;border-left:0;border-top:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px 14px 0 0}
  .zoom{margin-left:0}
}
</style>

  o=o||{};

  for(const a in eqByApp){const f=eqByApp[a].find(x=>x.eq.tag===key||x.eq.app===key);if(f){ent=f;break}}
  if(!ent)return false;
  const app=ent.eq.app;
  const pref=eqByApp[app].find(x=>x.sheet===(o.sheet||sheet))||ent;
  if(pref.sheet!==sheet)showSheet(pref.sheet,true);
  sel={t:'eq',tag:pref.eq.tag,app};
  paintSel();openEqCard(pref.eq,pref.sheet);ioShow([pref.eq.tag]);
  if(o.zoom!==false)zoomBox(pref.eq.box,300,1.0);
  return true;
}
function selectStream(id,o){
  o=o||{};
  if(medium&&kindOf(id)!==medium)setMedium(null);
  let s=sheet;
  if(!sheetOf(s).st.some(x=>x.id===id&&!x.ref)){const f=stSheets(id)[0];if(f)s=f;else{const g=SH.find(z=>z.st.some(x=>x.id===id));if(!g)return false;s=g.n}}
  if(s!==sheet)showSheet(s,true);
  sel={t:'st',id};paintSel();openStCard(id);ioForStream(id);
  const x=sheetOf(sheet).st.find(z=>z.id===id);
  if(o.zoom!==false&&x){const pts=x.lines.length?x.lines.flatMap(l=>[[l[0],l[1]],[l[2],l[3]]]):[x.c];
    const xs=pts.map(p=>p[0]).concat(x.c[0]),ys=pts.map(p=>p[1]).concat(x.c[1]);
    zoomBox([Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)],200,1.2)}
  return true;
}

// ---------- входы и выходы по аппарату ----------
const ioEl=$('io');let ioCur=null,ioAct=null,ioMinPref=null;
const unitOf=k=>(k==='gas'||k==='air')?'nm3':'th';
function ioVals(id){const z=ST[id];if(!z)return null;
  if(z.g)return {u:'nm3',q:z.g[6],t:z.g[8],p:z.g[7],pu:'kPa'};
  return {u:'th',q:z.th,t:z.t,p:z.p,pu:z.p!==undefined?'MPa':''}}
function ioFlows(tag){ // [{id,dir:'in'|'out',thru}]
  const fl=sheetOf(sheet).flow||{},r=[];
  Object.keys(fl).forEach(k=>{const [src,dst,thru]=fl[k],id=+k;
    if(dst.includes(tag))r.push({id,dir:'in'});
    if(src.includes(tag))r.push({id,dir:'out'});
    if(thru.includes(tag)){r.push({id,dir:'in',thru:1});r.push({id,dir:'out',thru:1})}});
  return r}
const MW=[64.066,80.06,31.998,28.013];
function massOf(id){const z=ST[id];if(!z)return null;
  if(z.g)return (z.g[0]*MW[0]+z.g[1]*MW[1]+z.g[2]*MW[2]+z.g[3]*MW[3]+(z.g[5]||0)*18.015)/22414;
  return typeof z.th==='number'?z.th:null}
function massBal(tag){let i=0,o=0,ni=0,no=0;const seen=new Set();
  SH.forEach(sh=>Object.entries(sh.flow||{}).forEach(([k,[src,dst,thru]])=>{const q=massOf(k);if(q===null||seen.has(k))return;seen.add(k);
    if(dst.includes(tag)||thru.includes(tag)){i+=q;ni++}
    if(src.includes(tag)||thru.includes(tag)){o+=q;no++}}));
  return ni&&no?{d:i-o,pc:i?Math.abs(i-o)/i*100:0}:null}
function ioCard(e){
  const T=L(),c=CARD[e.app],fl=ioFlows(e.tag).sort((a,b)=>a.id-b.id);
  const row=f=>{const z=ST[f.id],v=ioVals(f.id);if(!z||!v)return '';
    const col=`var(${KCOL[z.k==='gas'&&z.n==='Воздух'?'air':z.k]||'--accent'})`;
    const q=v.q===undefined?'—':fmt(v.q)+' '+(v.u==='nm3'?T.nm3:T.tph);
    const pr=v.p===undefined?'—':fmt(v.p)+' '+(v.pu==='kPa'?'кПа':v.pu==='MPa'?'МПа':'');
    return `<tr data-id="${f.id}"${ioAct===f.id?' class="act"':''}><td class="n"><span class="dot" style="background:${col}"></span><b>${f.id}</b></td><td class="nm">${esc(z.n)}${z.wt?` <small>${esc(z.wt)} %</small>`:''}${f.thru?` <small>· ${esc(T.ioPump)}</small>`:''}</td><td class="r">${esc(q)}</td><td class="r">${v.t===undefined?'—':fmt(v.t)}</td><td class="r">${esc(pr)}</td></tr>`};
  const sec=(d,cls)=>{const l=fl.filter(f=>f.dir===d);
    return `<tr class="sec ${cls}"><td colspan="5">${esc(d==='in'?T.ioIn:T.ioOut)}</td></tr>`+(l.length?l.map(row).join(''):`<tr><td colspan="5"><small>${esc(d==='in'?T.ioNoIn:T.ioNoOut)}</small></td></tr>`)};
  const sum={nm3:{i:0,o:0,ni:0,no:0},th:{i:0,o:0,ni:0,no:0}};
  fl.forEach(f=>{const v=ioVals(f.id);if(!v||typeof v.q!=='number')return;const g=sum[v.u];if(f.dir==='in'){g.i+=v.q;g.ni++}else{g.o+=v.q;g.no++}});
  let foot='';
  ['nm3','th'].forEach(u=>{const g=sum[u];if(!g.ni&&!g.no)return;const un=u==='nm3'?T.nm3:T.tph;
    foot+=`<tr class="sum"><td colspan="2">${esc(T.ioSumIn)} / ${esc(T.ioSumOut)}</td><td class="r" colspan="3">${g.ni?fmt(+g.i.toFixed(2)):'—'} / ${g.no?fmt(+g.o.toFixed(2)):'—'} ${esc(un)}</td></tr>`;
    if(g.ni&&g.no&&u==='th'){const d=g.i-g.o,pc=g.i?Math.abs(d)/g.i*100:0,ok=pc<=0.5;
      foot+=`<tr class="bal ${ok?'good':'warn'}"><td colspan="2">${esc(T.ioBal)}</td><td class="r" colspan="3">${d>0?'+':''}${fmt(+d.toFixed(2))} ${esc(un)} · ${ok?esc(T.ioOk):fmt(+pc.toFixed(1))+' % — '+esc(T.ioDiff)}</td></tr>`}});
  // газ в Нм³/ч не сохраняется (SO₂+½O₂→SO₃, поглощение SO₃ в кислоту): баланс — по массе, по всем листам, газ + жидкость
  const mb=massBal(e.tag);
  if(mb&&sum.nm3.ni&&sum.nm3.no){const ok=mb.pc<=0.5;
    foot+=`<tr class="bal ${ok?'good':'warn'}"><td colspan="2">${esc(T.ioBalM)}</td><td class="r" colspan="3">${mb.d>0?'+':''}${fmt(+mb.d.toFixed(2))} ${esc(T.tph)} · ${ok?esc(T.ioOk):fmt(+mb.pc.toFixed(1))+' % — '+esc(T.ioDiff)}</td></tr>`}
  return `<div class="ioc"><h3><span class="tag">${esc(e.tag)}</span>${esc(c?nm(c,'n'):'')}</h3><table class="iot"><thead><tr><th>${esc(T.ioN)}</th><th>${esc(T.ioMed)}</th><th class="r">${esc(T.ioQ)}</th><th class="r">${esc(T.ioTemp)}</th><th class="r">${esc(T.ioP)}</th></tr></thead><tbody>${sec('in','in')}${sec('out','out')}${foot}</tbody></table></div>`}
function ioShow(tags,sid){
  const T=L(),label=sid?`${T.stream} ${sid}`:tags[0];ioAct=sid||null;
  const eqs=tags.map(t=>sheetOf(sheet).eq.find(e=>e.tag===t)).filter(Boolean);
  if(!eqs.length){ioHide();return}
  ioCur={tags,sid};
  $('ioT').textContent=T.ioT;$('ioS').textContent=label;
  $('iob').innerHTML=eqs.map(ioCard).join('')+`<p class="ionote" style="flex:0 0 220px">${esc(T.ioNote)}</p>`;
  ioEl.hidden=false;ioMinSet(ioMinPref===null?matchMedia('(max-width:760px)').matches:ioMinPref);relayout();
  $('iob').querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>ioRow(+r.dataset.id));
}
function ioHide(){ioCur=null;ioAct=null;const was=ioEl.hidden;ioEl.hidden=true;document.body.classList.remove('ioopen');if(!was)relayout()}
function ioMinSet(m){ioEl.classList.toggle('min',m);document.body.classList.toggle('ioopen',!m&&!ioEl.hidden);$('ioMin').textContent=m?L().ioMax:L().ioMin}
function ioRow(id){ // подсветить поток на схеме, не меняя набор аппаратов в панели
  ioAct=id;sel={t:'st',id};paintSel();openStCard(id);
  $('iob').querySelectorAll('tr[data-id]').forEach(r=>r.classList.toggle('act',+r.dataset.id===id))}
function ioForStream(id){
  const f=(sheetOf(sheet).flow||{})[id];let tags=f?[...new Set([...f[0],...f[2],...f[1]])]:[];
  if(!tags.length)tags=sheetOf(sheet).eq.filter(e=>e.streams.includes(id)&&Object.keys(sheetOf(sheet).flow||{}).length&&ioFlows(e.tag).some(x=>x.id===id)).map(e=>e.tag);
  if(!tags.length){ioHide();return}
  ioShow(tags,id)}
const relayout=()=>{const was=k/fitK;computeFit();k=Math.max(fitK,was*fitK);applyView()};
new ResizeObserver(relayout).observe(vp);
$('ioMin').onclick=()=>{ioMinPref=!ioEl.classList.contains('min');ioMinSet(ioMinPref)};
$('ioX').onclick=ioHide;

// ---------- card ----------
function closeCard(){card.classList.remove('open');sel=null;paintSel();ioHide()}
function openCard(html){card.innerHTML=`<button class="x" type="button" id="cx" aria-label="${esc(L().close)}">×</button>`+html;card.classList.add('open');card.scrollTop=0;$('cx').onclick=closeCard}
function openEqCard(e,shn){
  const c=CARD[e.app],T=L();
  const others=(eqByApp[e.app]||[]).filter(x=>x.sheet!==shn);
  const regRows=c?c.reg.slice(0,6).map(r=>`<tr><td>${esc(nm(r,'n'))}</td><td>${esc([r.f,r.T&&(r.T+' °C'),r.P&&(r.P+(/кПа/.test(r.P)?'':' МПа')),r.L&&('L '+r.L),r.o].filter(Boolean).join(' · '))}</td></tr>`).join(''):'';
  openCard(`
   <div class="eyebrow">${esc(T.sheet)} ${shn} · ${esc(nm(D.meta.sheets[shn-1],'name'))}</div>
   <h2>${esc(c?nm(c,'n'):e.tag)}</h2>
   <div><span class="tag">${esc(e.app)}</span>${e.tag!==e.app?`<span class="pill" title="${esc(T.pfdTag)}">PFD: ${esc(e.tag)}</span>`:''}${c&&c.m?'<span class="pill ok">3D</span>':''}</div>
   ${c?`<dl class="kv"><dt>${esc(T.qty)}</dt><dd>${esc(c.q||'—')}</dd><dt>${esc(T.mass)}</dt><dd>${c.w?fmt(+c.w):'—'}</dd></dl>
     ${c.d.length?`<ul class="specs">${c.d.slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
     ${regRows?`<div class="eyebrow">${esc(T.reg)}</div><table class="regmini">${regRows}</table>`:''}`:`<p class="note">${esc(T.noCard)}</p>`}
   ${e.streams.length?`<div class="eyebrow">${esc(T.streams)}</div><div class="chips">${e.streams.map(id=>`<button type="button" data-st="${id}">${id}</button>`).join('')}</div>`:''}
   ${others.length?`<div class="eyebrow">${esc(T.also)}</div><div class="chips">${others.map(x=>`<button type="button" data-sh="${x.sheet}" data-tag="${esc(x.eq.tag)}">${esc(T.sheet)} ${x.sheet}</button>`).join('')}</div>`:''}
   <div class="acts"><button class="btn pri" type="button" id="b3d">${esc(T.to3d)}</button><button class="btn" type="button" id="bFlow">${esc(T.toFlow)}</button></div>
   ${e.tag==='TW-11304'?`<p class="note">${esc(T.tailNote)}</p>`:''}
   <p class="note">${esc(T.src)}${esc(D.meta.code)}, ${esc(nm(D.meta.sheets[shn-1],'name'))}</p>`);
  card.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>selectStream(+b.dataset.st,{zoom:true}));
  card.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>selectEq(b.dataset.tag,{sheet:+b.dataset.sh}));
  $('b3d').onclick=()=>goto('model',e.app); $('bFlow').onclick=()=>goto('flow',e.app);
}
function openStCard(id){
  const s=ST[id],T=L();const on=SH.filter(z=>z.st.some(x=>x.id===id)).map(z=>z.n);
  const x=sheetOf(sheet).st.find(z=>z.id===id);
  const eqs=[];SH.forEach(z=>z.eq.forEach(e=>{if(z.n===sheet&&e.streams.includes(id))eqs.push(e)}));
  let rows='';
  if(s){
    if(s.k==='gas'){const keys=['SO2','SO3','O2','N2','dry','H2O','wet'];
      rows=keys.map((key,i)=>`<dt>${esc(T.comps[key])}</dt><dd>${fmt(s.g[i])}</dd>`).join('')+`<dt>${esc(T.p)}, ${esc(T.pkPa)}</dt><dd>${fmt(s.g[7])}</dd><dt>${esc(T.t)}</dt><dd>${fmt(s.g[8])}</dd>`}
    else if(s.p!==undefined){rows=`<dt>${esc(T.p)}, ${esc(T.pMPa)}</dt><dd>${fmt(s.p)}</dd><dt>${esc(T.t)}</dt><dd>${fmt(s.t)}</dd><dt>${esc(T.th)}</dt><dd>${fmt(s.th)}</dd>`}
    else{rows=(s.wt?`<dt>${esc(T.wt)}</dt><dd>${esc(s.wt)}</dd>`:'')+`<dt>${esc(T.th)}</dt><dd>${fmt(s.th)}</dd><dt>${esc(T.rho)}</dt><dd>${fmt(s.rho)}</dd><dt>${esc(T.m3)}</dt><dd>${fmt(s.m3)}</dd><dt>${esc(T.t)}</dt><dd>${fmt(s.t)}</dd>`}
  }
  const ref=x&&x.ref;
  openCard(`
   <div class="eyebrow">${esc(T.sheet)} ${sheet} · ${esc(nm(D.meta.sheets[sheet-1],'name'))}</div>
   <h2><span class="dot" style="background:var(${KCOL[s&&s.k==='gas'&&s.n==='Воздух'?'air':(s&&s.k)]||'--accent'})"></span>${esc(T.stream)} ${id}${s?' · '+esc(s.n):''}</h2>
   ${ref?`<p class="note">${esc(T.gasRef)}</p><div class="acts"><button class="btn pri" type="button" id="bS1">${esc(T.openSheet1)}</button></div>`:`<dl class="kv">${rows}</dl>`}
   ${x&&!x.lines.length&&!ref?`<p class="note">${esc(T.noLine)}</p>`:''}
   ${eqs.length?`<div class="eyebrow">${esc(T.joins)}</div><div class="chips">${eqs.map(e=>`<button type="button" data-tag="${esc(e.tag)}">${esc(e.tag)}</button>`).join('')}</div>`:''}
   ${on.length>1?`<div class="eyebrow">${esc(T.onSheets)}</div><div class="chips">${on.map(n=>`<button type="button" data-sh="${n}">${esc(T.sheet)} ${n}</button>`).join('')}</div>`:''}
   <p class="note">${esc(T.src)}${esc(D.meta.code)}, ${esc(nm(D.meta.sheets[sheet-1],'name'))}</p>`);
  card.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>selectEq(b.dataset.tag,{sheet}));
  card.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{showSheet(+b.dataset.sh,true);selectStream(id,{zoom:true})});
  if($('bS1'))$('bS1').onclick=()=>{showSheet(1,true);selectStream(id,{zoom:true})};
}

// ---------- search ----------
function fillSearch(){
  const dl=$('qlist');dl.textContent='';const seen=new Set();
  SH.forEach(s=>s.eq.forEach(e=>{if(seen.has(e.tag))return;seen.add(e.tag);const c=CARD[e.app];const o=document.createElement('option');o.value=e.tag;o.label=c?nm(c,'n'):'';dl.appendChild(o)}));
  Object.keys(ST).sort((a,b)=>a-b).forEach(id=>{const o=document.createElement('option');o.value=id;o.label=`${L().stream} · ${ST[id].n}`;dl.appendChild(o)});
}
$('q').addEventListener('change',e=>{const v=e.target.value.trim().toUpperCase();if(!v)return;
  if(/^\d+$/.test(v)){if(selectStream(+v))return}
  if(!selectEq(v)){const low=e.target.value.trim().toLowerCase();
    const hit=Object.keys(CARD).find(a=>(CARD[a].n+' '+(CARD[a].nu||'')).toLowerCase().includes(low));if(hit)selectEq(hit)}
});

// ---------- links with other tabs ----------
function goto(to,tag){try{window.parent.postMessage({__tmkGoto:{to,tag,from:'pfd'}},'*')}catch(e){}}
window.addEventListener('message',e=>{
  const d=e.data;if(!d||!d.__tmkFocus)return;
  if(d.stream!==undefined)selectStream(+d.stream);else if(d.tag)selectEq(d.tag);
});

// ---------- language / theme ----------
function paint(l){
  lang=l==='uz'?'uz':'ru';const T=L();
  $('q').placeholder=T.search;$('q').setAttribute('aria-label',T.search);
  $('bZones').textContent=T.zones;$('bScan').textContent=T.scan;$('bCmp').textContent=T.cmp;paintLeg();$('zFit').textContent=T.fit;$('hint').textContent=T.hint;if(ioCur)ioShow(ioCur.tags,ioCur.sid);
  document.title=T.title;paintTabs();fillSearch();
  if(sel&&sel.t==='eq'){const f=eqByApp[sel.app].find(x=>x.sheet===sheet);if(f)openEqCard(f.eq,sheet)}
  else if(sel&&sel.t==='st')openStCard(sel.id);
}
TmkLang.initChild(paint);TmkTheme.initChild(function(){});
showSheet(1);paint(TmkLang.getLang());
setTimeout(()=>{if(!sel)fit(false)},0);
try{window.parent.postMessage({__tmkReady:'pfd'},'*')}catch(e){}
// открыто при загрузке по якорю #tag=EX-11201 или #stream=53
(function(){const m=/^#(tag|stream)=(.+)$/.exec(location.hash||'');if(!m)return;
  const v=decodeURIComponent(m[2]);setTimeout(()=>m[1]==='tag'?selectEq(v):selectStream(+v),50)})();
// для отладки/проверки
window.__pfd={selectEq,selectStream,showSheet,get state(){return {sheet,sel,k,fitK}}};
})();
</script>
